name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: abc
          POSTGRES_PASSWORD: abc
          POSTGRES_DB: abc_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Typecheck
        run: uv run pyright src/

      - name: Alembic drift check
        run: |
          uv run alembic upgrade head
          uv run alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://abc:abc@localhost:5432/abc_test
          SECRET_KEY: ci-test-secret-key-not-for-production

      - name: Unit tests (mocked)
        run: uv run pytest tests/ -v
        env:
          DATABASE_URL: postgresql+asyncpg://abc:abc@localhost:5432/abc_test
          SECRET_KEY: ci-test-secret-key-not-for-production

      - name: Integration test (real DB)
        run: uv run pytest tests/test_integration.py -v
        env:
          DATABASE_URL: postgresql+asyncpg://abc:abc@localhost:5432/abc_test
          SECRET_KEY: ci-test-secret-key-not-for-production
          RUN_INTEGRATION: "1"

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Lint
        run: npm run lint
        working-directory: ./frontend

      - name: Typecheck + Build
        run: npm run build
        working-directory: ./frontend

  deploy-hf-spaces:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deploy tooling
        run: pip install --quiet huggingface_hub

      - name: Deploy to Hugging Face Spaces
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN not set — skipping deploy"
            exit 0
          fi
          python scripts/deploy_hf.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
