name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd /home/runner/work/ABC-Compliance-Platform/ABC-Compliance-Platform
          pip install --only-binary :all: -r requirements.txt

      - name: Run pytest
        run: |
          cd /home/runner/work/ABC-Compliance-Platform/ABC-Compliance-Platform
          pytest -q

      - name: Run pip-audit
        run: |
          pip install --only-binary :all: pip-audit
          pip-audit -r requirements.txt --desc

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci --ignore-scripts

      - name: Run lint (ESLint)
        run: |
          cd frontend
          npm run lint

      - name: Run oxlint
        run: |
          cd frontend
          npx oxlint src/

      - name: Run impeccable
        run: |
          cd frontend
          npx impeccable detect src/ --json

      - name: Type check
        run: |
          cd frontend
          npm run typecheck

      - name: Build
        run: |
          cd frontend
          npm run build

      - name: Run Vitest
        run: |
          cd frontend
          npx vitest run

      - name: Run Playwright tests
        run: |
          cd frontend
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Run npm audit
        run: |
          cd frontend
          npm audit --audit-level=high --ignore-scripts