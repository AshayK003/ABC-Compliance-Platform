[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/"]

[project]
name = "abc-dashboard"
version = "0.5.0"
description = "ABC Compliance Platform — Digital compliance infrastructure for Animal Birth Control centres. Licensed under AGPLv3."
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.13,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "pyjwt>=2.9,<3",
    "bcrypt>=4.1,<6",
    "slowapi>=0.1.9,<1",
    "pdf-studio-py[charts,tables]>=0.1.2,<0.2",
    "openpyxl>=3.1,<4",
    "matplotlib>=3.8,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
    "pyright>=1.1,<2",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/*/routes.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests against a real PostgreSQL database (deselect with '-m \"not e2e\"')",
]
